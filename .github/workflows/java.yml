name: Build Temurin images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: temurin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27']
    env:
      JAVA_VERSION: ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}:java_${JAVA_VERSION}" >> "$GITHUB_ENV"
      - name: Build and test both architectures
        run: |
          for arch in amd64 arm64; do
            docker buildx build --pull --load \
              --platform "linux/$arch" \
              --build-arg "JAVA_VERSION=$JAVA_VERSION" \
              --tag "temurin-test:$arch" .
            bash tests/smoke.sh "temurin-test:$arch" "$JAVA_VERSION" "linux/$arch"
          done
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: JAVA_VERSION=${{ matrix.java }}
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
